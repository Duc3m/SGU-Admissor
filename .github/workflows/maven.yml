name: Java CI with Maven, MySQL and Secrets

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: sguadmissor
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Initialize Database
      run: |
        mysql -h 127.0.0.1 -u root -p"${{ secrets.DB_PASSWORD }}" sguadmissor < database/script.sql

    - name: Build with Maven

      run: mvn -B package --file pom.xml -Ddb.password=${{ secrets.DB_PASSWORD }}